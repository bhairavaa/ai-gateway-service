[alembic]
script_location = migrations
prepend_sys_path = .

# The real URL is injected at runtime by migrations/env.py from app.config.Settings
# (DATABASE_URL env var) — this placeholder is only used if env.py is bypassed.
sqlalchemy.url = sqlite+aiosqlite:///./data/gateway.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
